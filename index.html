<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Advisor Desk</title>
  <meta name="description" content="แอปส่วนตัวของที่ปรึกษาการเงิน — คลังแผน แพ็กเกจ ระบบแนะนำ ลูกค้า และงานขาย">
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151917" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Advisor Desk">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/ui2.css">
  <link rel="stylesheet" href="css/ui3.css">
  <link rel="stylesheet" href="css/ui4.css">
  <link rel="stylesheet" href="css/ui5.css">
  <link rel="stylesheet" href="css/ui6.css">
  <link rel="stylesheet" href="css/ui7.css">
  <script>
    // ตั้งค่าธีม/ขนาดตัวอักษรก่อนแสดงผล (ไม่ให้จอกระพริบ)
    try { var t = localStorage.getItem('advdesk.v1.theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t;
      var z = localStorage.getItem('advdesk.v1.textsize'); if (z) document.documentElement.dataset.text = z;
      var c = localStorage.getItem('advdesk.v1.palette'); if (c && c !== 'ink') document.documentElement.dataset.palette = c;
      var ld = localStorage.getItem('advdesk.v1.leading'); if (ld) document.documentElement.dataset.leading = ld;
      var hc = localStorage.getItem('advdesk.v1.contrast'); if (hc && hc !== 'normal') document.documentElement.dataset.contrast = hc;
      var rm = localStorage.getItem('advdesk.v1.motion'); if (rm) document.documentElement.dataset.motion = rm; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view" onclick="event.preventDefault();var v=document.querySelector('#view h1')||document.getElementById('view');v.setAttribute('tabindex','-1');v.focus();">ข้ามไปเนื้อหา</a>
  <div id="splash" aria-hidden="true"><img src="assets/icon-192.png" alt="" width="88" height="88"><div>Advisor Desk</div></div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"><div class="page" id="view" aria-live="polite"></div></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="เมนูหลัก"></nav>
  <div class="toast" id="toast" role="status"></div>
  <noscript><p style="padding:24px">ต้องเปิด JavaScript เพื่อใช้งานแอปนี้</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
