<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Advisor Desk</title>
  <meta name="description" content="แอปส่วนตัวของที่ปรึกษาการเงิน — คลังแผน แพ็กเกจ ระบบแนะนำ ลูกค้า และงานขาย">
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151917" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Advisor Desk">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/ui2.css">
  <link rel="stylesheet" href="css/ui3.css">
  <link rel="stylesheet" href="css/ui4.css">
  <link rel="stylesheet" href="css/ui5.css">
  <link rel="stylesheet" href="css/ui6.css">
  <link rel="stylesheet" href="css/ui7.css">
  <link rel="stylesheet" href="css/ui8.css">
  <link rel="stylesheet" href="css/ui9.css">
  <script>
    // ตั้งค่าธีม/ขนาดตัวอักษรก่อนแสดงผล (ไม่ให้จอกระพริบ)
    try { var t = localStorage.getItem('advdesk.v1.theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t;
      var z = localStorage.getItem('advdesk.v1.textsize'); if (z) document.documentElement.dataset.text = z;
      var c = localStorage.getItem('advdesk.v1.palette'); if (c && c !== 'ink') document.documentElement.dataset.palette = c;
      var ld = localStorage.getItem('advdesk.v1.leading'); if (ld) document.documentElement.dataset.leading = ld;
      var hc = localStorage.getItem('advdesk.v1.contrast'); if (hc && hc !== 'normal') document.documentElement.dataset.contrast = hc;
      var rm = localStorage.getItem('advdesk.v1.motion'); if (rm) document.documentElement.dataset.motion = rm;
      var bc = localStorage.getItem('advdesk.v1.brandCss'); if (bc && c === 'custom') document.write('<style id="brand-css">' + bc.replace(/</g, '') + '</style>');
      var fo = localStorage.getItem('advdesk.v1.font'); var FU = { plex: 'IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600', noto: 'Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700' };
      if (fo && FU[fo]) { document.documentElement.dataset.font = fo; document.write('<link rel="stylesheet" id="font-' + fo + '" href="https://fonts.googleapis.com/css2?family=' + FU[fo] + '&display=swap">'); }
      var sh = localStorage.getItem('advdesk.v1.shape'); if (sh) document.documentElement.dataset.shape = sh;
      var dn = localStorage.getItem('advdesk.v1.density'); if (dn) document.documentElement.dataset.density = dn;
      var du = localStorage.getItem('advdesk.v1.duo'); if (du) document.documentElement.dataset.duo = du; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view" onclick="event.preventDefault();var v=document.querySelector('#view h1')||document.getElementById('view');v.setAttribute('tabindex','-1');v.focus();">ข้ามไปเนื้อหา</a>
  <div id="splash" aria-hidden="true"><div class="sp-mark"><img src="assets/icon-192.png" alt="" width="84" height="84"><span id="sp-ini"></span></div><b id="sp-name">Advisor Desk</b><small id="sp-tag">ที่ปรึกษาการเงินส่วนตัว</small><i class="sp-bar"></i></div>
  <script>
    // หน้าเปิดแอปแบบมีชื่อแบรนด์ (อ่านจากโปรไฟล์ในเครื่อง)
    try { var st = JSON.parse(localStorage.getItem('advdesk.v1.settings') || '{}'); var pf = (st.main && st.main.profile) || {};
      if (location.hash.indexOf('#/p/') === 0) { document.getElementById('splash').remove(); }
      else if (pf.name) { document.getElementById('sp-name').textContent = pf.nick ? pf.nick : pf.name; document.getElementById('sp-tag').textContent = pf.tagline || ((pf.title || '') + (pf.company ? ' · ' + pf.company : ''));
        var n0 = pf.name.trim(), ch = n0.charAt(0); if ('เแโใไ'.indexOf(ch) >= 0) ch = n0.charAt(1); document.getElementById('sp-ini').textContent = ch; document.getElementById('splash').classList.add('named'); } } catch (e) {}
  </script>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"><div class="page" id="view" aria-live="polite"></div></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="เมนูหลัก"></nav>
  <div class="toast" id="toast" role="status"></div>
  <noscript><p style="padding:24px">ต้องเปิด JavaScript เพื่อใช้งานแอปนี้</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
