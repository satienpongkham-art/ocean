name: system-app

on:
  push:
    paths:
      - "system-app/**"
      - ".github/workflows/system-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew :engine:test :app:testDebugUnitTest :app:assembleDebug --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: system-app-debug
          path: system-app/app/build/outputs/apk/debug/app-debug.apk
